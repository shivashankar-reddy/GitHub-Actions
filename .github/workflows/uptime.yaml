name: Testing shell
on: workflow_dispatch
jobs:
    files:
        runs-on: ubuntu-latest
        steps:
            - name: Git checkout
              uses: actions/checkout@v5
            - name: Display data in file
              run: cat devops.txt
            - name: display Date
              run: date
            - name: change permission
              run: chmod +x uptime.sh
            - name: execute the shell
              run: ./uptime.sh
